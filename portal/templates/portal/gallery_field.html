<div class="editor-gallery-field" data-current-image="{{ current_url|default:'' }}">{{ upload.errors }}{{ selection.errors }}{% if hide_label %}<label class="sr-only" for="{{ upload.id_for_label }}">Featured image</label>{% else %}{{ upload.label_tag }}{% endif %}{{ upload }}{{ selection }}<button type="button" class="button light small" data-gallery-pick data-gallery-target="{{ selection.id_for_label }}" data-gallery-file="{{ upload.id_for_label }}">Choose from gallery</button><div class="editor-gallery-selection"{% if not preview_url %} hidden{% endif %}><img{% if preview_url %} src="{{ preview_url }}"{% endif %} alt="Selected post image" width="72" height="54"><span data-gallery-selection-label>{% if selection.value %}Selected from gallery{% else %}Current image{% endif %}</span><button type="button" class="text-button" data-gallery-clear{% if not selection.value %} hidden{% endif %}>Undo</button></div></div>
